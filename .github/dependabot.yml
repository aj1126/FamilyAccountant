# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: "weekly"
    # NestJS packages share one major version: bump them together, or a split major
    # (common 12 with core/testing 11) breaks the backend tests (see #76).
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
    # Breaking upgrades are done on purpose as their own task, not by Dependabot (AJ 2026-11-07):
    # NestJS 11 -> 12 failed the backend tests (#83); react-native 0.74 -> 0.88 failed the
    # client typecheck (#102). react-native is 0.x, and Dependabot reads x.y.z as
    # major.minor.patch, so 0.74 -> 0.88 is a "minor" bump: its minors are ignored too.
    # Patches still arrive, and security updates ignore update-types, so they still arrive.
    ignore:
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
    directory: "/"
    schedule:
      interval: "weekly"
